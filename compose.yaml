services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: habitat
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets:
      - pg_password
    ports:
      - "127.0.0.1:5432:5432" # Ограничиваем доступ только с хоста
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitat -d habitat"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: habitat
      DB_NAME: habitat
      DB_PORT: "5432"
      DB_PASSWORD_FILE: /run/secrets/pg_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MIGRATIONS_PATH: file:///app/migrations
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      BCRYPT_COST: "12"
    secrets:
      - pg_password
      - jwt_secret
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 35s # Важно для graceful shutdown (30s в коде + запас)

volumes:
  postgres_data:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt