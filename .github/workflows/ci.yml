name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habitat
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: habitat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: habitat
      DB_PASSWORD: test_password
      DB_NAME: habitat
      # для интеграционных тестов с шага 5; это НЕ секрет, а тестовое значение
      TEST_DSN: postgres://habitat:test_password@localhost:5432/habitat?sslmode=disable
      JWT_SECRET: ci-only-test-secret-change-me-0123456789

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - name: go.mod/go.sum актуальны
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...